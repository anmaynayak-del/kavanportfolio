name = "kavan-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2024-03-01"

# ── Environment variables ──────────────────────────────────────────────────────
# Set ADMIN_TOKEN as a secret (never in plain text here):
#   wrangler pages secret put ADMIN_TOKEN
#
# [vars]
# ENVIRONMENT = "production"

# ── D1 Database ────────────────────────────────────────────────────────────────
# Create with: wrangler d1 create portfolio-db
# Apply schema: wrangler d1 execute portfolio-db --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ── R2 Bucket ──────────────────────────────────────────────────────────────────
# Create with: wrangler r2 bucket create portfolio-images-bucket
[[r2_buckets]]
binding = "PORTFOLIO_IMAGES"
bucket_name = "portfolio-images-bucket"
